<html>
<head>
    <title>MiniMart - Login</title>
</head>
<body bgcolor="lightyellow">
<header>
    <table width="100%" style="background-color: #febd69">
        <tr>
            <td align="center" width="500" height="100">
                <img src="amazon_2logo.jpg" alt="Amazon Logo" width="250" height="100">
            </td>
           
        </tr>
    </table>
</header>
    <br><br>

    <!-- Login Form -->
    <center>
        <form action="home.html" method="get">
        <table border="2" bordercolor="orange" cellspacing="10" cellpadding="10" bgcolor="white" width="40%">
            <tr>
                <td colspan="2" align="center" style="background-color: #febd69"    >
                    <font face="Verdana" size="5" color="white"><b>Sign In</b></font>
                </td>
            </tr>

            <tr>
                <td><b>First Name:</b></td>
                <td><input type="text" name="firstname" size="25" required></td>
            </tr>

            <tr>
                <td><b>Last Name:</b></td>
                <td><input type="text" name="lastname" size="25" required></td>
            </tr>

            <tr>
                <td><b>Gender:</b></td>
                <td>
                    <input type="radio" name="gender" value="male"> Male
                    <input type="radio" name="gender" value="female"> Female
                </td>
            </tr>

            <tr>
                <td><b>Mobile No.:</b></td>
                <td><input type="tel" name="mobile" pattern="[0-9]{10}" placeholder="10-digit number" size="25" required></td>
            </tr>

            <tr>
                <td><b>Email ID:</b></td>
                <td><input type="email" name="email" size="25" required></td>
            </tr>

            <tr>
                <td><b>Password:</b></td>
                <td><input type="password" name="password" size="25" required></td>
            </tr>

            <tr align="center">
                <td colspan="2">
                    <input type="submit" value="Submit" style="background-color:rgb(236, 159, 17); color:white; font-size:15px; border:none; padding:8px 20px; border-radius:5px;">
                    <input type="reset" value="Reset" style="background-color:gray; color:white; font-size:15px; border:none; padding:8px 20px; border-radius:5px;">
                </td>
            </tr>
        </table>
        </form>
    </center>

    <br><br>

    <!-- Footer -->
    <footer style="background-color: #febd69; padding: 10px; position: fixed; bottom: 0; width: 100%;">
        
        <p align="center">© 2025 Mini Mart. All rights reserved.</p>
    </footer>

</body>
</html>
