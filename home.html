<html>
<head>
  <title>Mini Mart</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="logo"><img src="amazon_2logo.jpg" alt="Mini Mart Logo" width="200" height="80"/></div>
    <form class="search-form" action="#" method="get">
      <input type="text" name="search" placeholder="Search for products..." class="search-bar" />
      <button type="submit" class="search-btn">Search</button>
    </form>
    <nav class="nav-links">
      <a href="#">Cart</a>
    </nav>
  </header>

  <section class="shop-image">
    <img src="shop.jpg" alt="Shop banner" />
  </section>
  
  <section class="hero">
    <h1>Welcome to Mini Mart</h1>
    <p>Shop the best deals, just like Amazon!</p>
    <button type="button">Shop Now</button>
  </section>
 
  <section class="categories">
    <h2>Shop by Category</h2>
    <div class="category-container">
      <button type="button" class="category">Electronics</button>
      <button type="button" class="category">Clothing</button>
      <button type="button" class="category">Home</button>
      <button type="button" class="category">Books</button>
      <button type="button" class="category">Toys</button>
    </div>
  </section>

  <section class="products">
    <h2>Featured Products</h2>
    <div class="product-grid">
      <div class="product">
        <img src="product1.jpg" alt="Product 1" />
        <h3>Product 1</h3>
        <p>Rs 700</p>
        <button type="button">Add to Cart</button>
      </div>
      <div class="product">
        <img src="product2.jpg" alt="Product 2" />
        <h3>Product 2</h3>
        <p>Rs 1500</p>
        <button type="button">Add to Cart</button>
      </div>
      <div class="product">
        <img src="product3.jpg" alt="Product 3" />
        <h3>Product 3</h3>
        <p>Rs 750</p>
        <button type="button">Add to Cart</button>
      </div>
    </div>
  </section>
 <footer style="background-color: rgb(4, 4, 65);">
  
  <center>
<table cellspacing="30" cellpadding="10">
  <tr>
    <td cellspacing="2"> <a href="main.html"><button type="button" class="footer-btn" style="background-color:rgb(236, 159, 17); color:white; font-size:15px; border:none; padding:8px 20px; border-radius:5px; align-items: center; " >Sign Out</button></a>
    <a href="home.html"><button type="button" class="footer-btn" style="background-color:rgb(236, 159, 17); color:white; font-size:15px; border:none; padding:8px 20px; border-radius:5px; align-items: center;">Back To Top</button></a></td>
  </tr>  
  

</table>   
  <p style="color: antiquewhite;">© 2025 Mini Mart. All rights reserved.</p>
</center>

 </footer>
</body>
</html>
