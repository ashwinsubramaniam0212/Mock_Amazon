<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock Amazon</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="logo">Mock Amazon</div>
    <form class="search-form" action="#" method="get">
      <input type="text" name="search" placeholder="Search for products..." class="search-bar" />
      <button type="submit" class="search-btn">Search</button>
    </form>
    <nav class="nav-links">
      <a href="#">Cart</a>
    </nav>
  </header>

  <section class="shop-image">
    <img src="shop.jpg" alt="Shop banner" />
  </section>
  
  <section class="hero">
    <h1>Welcome to Mock Amazon</h1>
    <p>Shop the best deals, just like Amazon!</p>
    <button type="button">Shop Now</button>
  </section>
 
  <section class="categories">
    <h2>Shop by Category</h2>
    <div class="category-container">
      <button type="button" class="category">Electronics</button>
      <button type="button" class="category">Clothing</button>
      <button type="button" class="category">Home</button>
      <button type="button" class="category">Books</button>
      <button type="button" class="category">Toys</button>
    </div>
  </section>

  <section class="products">
    <h2>Featured Products</h2>
    <div class="product-grid">
      <div class="product">
        <img src="product1.jpg" alt="Product 1" />
        <h3>Product 1</h3>
        <p>Rs 700</p>
        <button type="button">Add to Cart</button>
      </div>
      <div class="product">
        <img src="product2.jpg" alt="Product 2" />
        <h3>Product 2</h3>
        <p>Rs 1500</p>
        <button type="button">Add to Cart</button>
      </div>
      <div class="product">
        <img src="product3.jpg" alt="Product 3" />
        <h3>Product 3</h3>
        <p>Rs 750</p>
        <button type="button">Add to Cart</button>
      </div>
    </div>
  </section>

</body>
</html>
